version: '3.8'

services:
  db:
    image: postgres:16
    container_name: analytics_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - analytics_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analytics_backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - analytics_net

volumes:
  pgdata:

networks:
  analytics_net:
